name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  agent-binaries:
    name: agent binaries (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Run agent tests
        run: uv run pytest shared/tests agent/tests -q

      - name: Build console CLI
        working-directory: agent
        run: uv run pyinstaller djutil-agent.spec --noconfirm --clean

      - name: Build windowed app
        working-directory: agent
        run: uv run pyinstaller djutil-agent-gui.spec --noconfirm --clean

      - name: Zip artifacts (Windows)
        if: runner.os == 'Windows'
        working-directory: agent/dist
        run: |
          Compress-Archive -Path "djutil-agent.exe" -DestinationPath "djutil-agent-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path "DJUtil Agent.exe" -DestinationPath "djutil-agent-gui-windows-${{ matrix.arch }}.zip"

      - name: Zip artifacts (macOS)
        if: runner.os == 'macOS'
        working-directory: agent/dist
        run: |
          # ditto keeps the .app bundle intact (unlike plain zip)
          ditto -c -k --keepParent "djutil-agent" "djutil-agent-macos-${{ matrix.arch }}.zip"
          ditto -c -k --keepParent "DJUtil Agent.app" "djutil-agent-gui-macos-${{ matrix.arch }}.zip"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: agent/dist/*.zip

  docker-image:
    name: server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
