name: server

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy shared server

      - name: Pytest (shared + server)
        run: uv run pytest -q shared/tests server/tests

      - name: Docker build
        run: docker build -f deploy/Dockerfile .
