services:
  app:
    # Pull the release image by default; `build:` stays as a fallback for
    # local builds (`docker compose build` / `--build`).
    image: ${DJUTIL_IMAGE:-ghcr.io/schegar/djutil:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    volumes:
      - djutil-data:/data
    restart: unless-stopped

  backup:
    # Nightly SQLite online backup into ./backups (keeps newest 14).
    # The data volume is mounted read-write: a WAL database can't be
    # opened read-only while it has a hot journal. The SQLite backup API
    # is online-safe, so this cannot corrupt the live DB. Artwork is not
    # backed up — the agent re-uploads it after a restore.
    image: ${DJUTIL_IMAGE:-ghcr.io/schegar/djutil:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    command: ["python", "-m", "djutil_server", "backup",
              "--dir", "/backups", "--keep", "14", "--loop-hours", "24"]
    volumes:
      - djutil-data:/data
      - ./backups:/backups
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    env_file: .env
    depends_on: [app]
    restart: unless-stopped

volumes:
  djutil-data:
  caddy-data:
  caddy-config:
