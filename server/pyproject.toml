[project]
name = "djutil-server"
version = "0.1.0"
description = "DJUtil server (FastAPI + SQLite)"
requires-python = ">=3.12"
dependencies = [
    "djutil-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.5",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djutil_server"]

[tool.hatch.build.targets.wheel.force-include]
"src/djutil_server/alembic" = "djutil_server/alembic"

[tool.uv.sources]
djutil-shared = { workspace = true }
