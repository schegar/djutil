[project]
name = "djutil-shared"
version = "0.1.0"
description = "Shared pydantic models for DJUtil"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/djutil_shared"]
